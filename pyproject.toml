[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dokkan"
version = "2.0.0"
description = "Automation bot for Dragon Ball Z: Dokkan Battle, driving an Android emulator over ADB"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Only for the two helper/ scripts that show a clickable screenshot
# (find_coords.py, crop_by_clicks.py). Not needed to run a mode.
helpers = [
    "matplotlib>=3.7",
]

[project.scripts]
dokkan = "dokkan.app:main"

[tool.setuptools.packages.find]
where = ["src"]
